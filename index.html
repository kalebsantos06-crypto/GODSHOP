    <script>
      // Suppress benign Vite HMR WebSocket connection errors in sandbox/cloud preview environments
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason || e);
        var str = String(reason && (reason.message || reason) || '');
        if (str.includes('WebSocket') || str.includes('websocket') || str.includes('closed without opened')) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var str = String(e && (e.message || e) || '');
        if (str.includes('WebSocket') || str.includes('websocket') || str.includes('closed without opened')) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
    <title>GODSHOP</title>
  </head>
